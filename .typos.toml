# Evaluation records preserve raw model responses verbatim, so a spelling
# correction inside a preserved answer would edit the evidence. Words that
# only appear inside preserved answers are accepted rather than rewritten.
# LICENSE-FONTS is upstream text and its axis tags are not misspellings.
[default.extend-words]
wdth = "wdth"
wght = "wght"
mis = "mis"
unparseable = "unparseable"
RTO = "RTO"
# machine-kai-ser8 is a machine name that appears in preserved run output.
ser = "ser"
# Player chat shorthand quoted verbatim in the Jev routing cases.
wth = "wth"
# Eco item names in the jevroute argument vocabulary.
Floatation = "Floatation"

# Commit refs, sha256 prefixes and trace ids are hex, so a letter run inside one
# is not a misspelling. The second pattern is the same fact for a prefixed id
# (med_, job_, run_), whose underscore stops the first pattern matching.
[default]
extend-ignore-re = [
  "\\b[0-9a-f]*[0-9][0-9a-f]*\\b",
  "\\b[a-z]+_[0-9a-f]{6,}\\b",
]

# evaluations/** is run evidence carried from agent-compose (COI-3302), and the two
# challenge files are derived prompts. Job ids and hashes inside them are not typos.
[files]
extend-exclude = ["evaluations/**", "challenges.yaml", "eval_cases.yaml"]
