[project]
name = "housecast"
dynamic = ["version"]
description = "Human-graded behavior evaluations: the grader, for any consumer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kai Ase Siren" }]
# Development Status corrects the 0.0.1 name-claim placeholder, which shipped
# `1 - Planning` because at that point there was no software behind the name.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# The engine needs only a YAML parser. Everything heavier belongs to the eval
# runner, which travels with it but is not what a consumer composing a bundle
# has to install.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# The grading half is housecast.grade. It rides this extra, so the engine stays
# installable without it.
eval = [
    "click>=8.1",
    "pydantic>=2.9",
    "rich>=13",
    # `housecast grade serve`.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sentry-sdk>=2.0,<3",
]
mcp = [
    "httpx>=0.27",
    "mcp>=1.2",
    "sentry-sdk>=2.0,<3",
]
# `housecast room serve`: the grading server's stack plus an async HTTP client.
room = [
    "click>=8.1",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "sentry-sdk>=2.0,<3",
]

[project.scripts]
housecast = "housecast.__main__:main"

[project.urls]
Homepage = "https://forgejo.coilysiren.me/coilyco-flight-deck/housecast"
Source = "https://forgejo.coilysiren.me/coilyco-flight-deck/housecast"
Issues = "https://forgejo.coilysiren.me/coilyco-flight-deck/housecast/issues"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    # starlette's TestClient is an httpx client, so the serve tests need it.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version is single-sourced from the package. Keeping it in both places
# drifted twice inside one migration: the tag said 0.1.3 and the metadata said
# 0.1.1, and nothing failed because a git dependency does not check.
[tool.hatch.version]
path = "housecast/__init__.py"

[tool.hatch.build.targets.wheel]
# py.typed ships so a consumer under mypy strict gets the types rather than an
# import-untyped error. The package is strict-clean here.
packages = ["housecast"]

# The wheel was scoped and the sdist was not, so the sdist took everything
# tracked: 239 files and 3.2 MB, of which `evaluations/` alone was 101 files and
# 55% of the bytes. That directory is committed run evidence quoting subject
# output verbatim, and PyPI accepts a version once and never lets it be
# replaced, so an unscoped sdist publishes a permanent copy of every board this
# repository has ever recorded. An allowlist rather than an exclude list,
# because the failure is a new directory nobody remembered to exclude.
[tool.hatch.build.targets.sdist]
# Every pattern is rooted. These are gitignore-style, so a bare `README.md`
# matches at any depth: the first version of this list shipped nine of them,
# one per evaluation directory, which is the exact content it was written to
# keep out.
include = [
    "/housecast",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/LICENSE-FONTS",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["housecast"]

[tool.pytest.ini_options]
testpaths = [
    "housecast/tests",
    "housecast/grade/tests",
    "housecast/mcp/tests",
    "housecast/mcpeval/tests",
    "housecast/jevroute/tests",
    "housecast/room/tests",
]

[tool.agentic-os.repo-pointer-skills]
org = "coilyco"

# .pre-commit-config.yaml is generated by apply-agentic-os-hooks.py, whose BEGIN
# and END markers are how it finds its own block. That exemption is permanent.
[tool.agentic-os.code-comments]
excludes = [".pre-commit-config.yaml"]

# Small. Pages stay short enough to read in one pass, and a subject that
# outgrows one page earns its own rather than a longer one.
[tool.agentic-os.documentation-layout]
band = "small"
