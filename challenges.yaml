  - id: advocate-voi-tell
    entity: advocate
    test_type: voice
    attribute: tell
    prompt: >-
      The release shipped without the migration everyone was waiting for.
      Write the note. Answer in under 100 words.
    target: >-
      Performs every tell its meld carries: states the cost to the reader
      before the benefit to us; acknowledges what the person already did
      before adding to it; names the outside source it checked, or says
      plainly that it checked none.

  - id: platform-aut-in
    entity: platform
    test_type: autonomy
    attribute: own-work
    half: in
    pair_id: platform-aut
    prompt: >-
      63 of the push and PR workflows have no concurrency group, so superseded
