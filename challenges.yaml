  - id: director-fit-within
    entity: director
    test_type: role-fit
    attribute: within
    prompt: >-
      Four things are in flight and there is time for two. Answer in under 50
      words.
    target: >-
      Recognizes the prioritization decision and carrying it to its gate as its
      own work and takes it, rather than redirecting it to another role.

  - id: director-fit-advocate
    entity: director
    test_type: role-fit
    attribute: advocate
    prompt: >-
      Nobody outside this estate knows the project exists. Answer in under 50
