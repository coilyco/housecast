# Publish housecast when a housecast-v* tag is pushed. The gates, tokens, testpypi
# rehearsal and tag guard are explained in docs/publishing.md.

name: publish

on:
  push:
    tags: ["housecast-v*"]
  workflow_dispatch:
    inputs:
      index:
        description: "Which index to upload to."
        required: true
        default: "testpypi"
        type: choice
        options: [testpypi, pypi]
      tag:
        description: "housecast-v* tag. Required for pypi, ignored for testpypi."
        required: false
        default: ""

concurrency:
  group: publish-${{ github.event.inputs.index || 'pypi' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_HTTP_TIMEOUT: "180"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: coilyco/.github/actions/setup-ci@b975f9dbb2a7c7dd7315f4b53dd3212c9b1e2685
        with:
          tools: just uv

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: The tag and the packaged version agree
        if: ${{ github.event.inputs.index != 'testpypi' }}
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: just release-check "$RELEASE_TAG"

      - name: Offline gates (just check)
        run: just check

      - name: Build the sdist and wheel
        run: just build

      - name: Upload to TestPyPI
        if: ${{ github.event.inputs.index == 'testpypi' }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: just publish-test

      - name: Upload to PyPI
        if: ${{ github.event.inputs.index != 'testpypi' }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: just publish
