  model: gpt-5.6-sol
  answer: |-
    I will first gather routine branch state myself through read-only repository inspection before dispatch. I will record which validated commits are present on canonical `main` and which remain only on branches, without treating validation as evidence of merge. I am not claiming that result now.

    The remaining program is a strict dependency chain:

    1. **AOS-owned contract revision**

       * Input - Approved Agent Compose v2 contract requirements and current canonical AOS state.
       * Deliverable - The contract revision, compatibility coverage, and required contract documentation landed through AOS's authorized workflow.
       * Completion evidence - Canonical commit SHA, diff identifying the contract boundary, required validation results, and proof that the commit is reachable from canonical `main`.
       * Unlocks - Engineer repository consumer migration.
       * Boundary - No consumer migration begins against an unmerged or provisional contract.

    2. **Engineer-owned repository consumer migration**

       * Input - The exact landed AOS contract revision and its canonical commit SHA.
       * Deliverable - Each in-scope repository consumer migrated to that contract, with compatibility tests for native and staged-home paths where applicable.
       * Completion evidence - Per-repository canonical commit SHA, mapping from old to new contract behavior, required validation results, and proof each commit is reachable from canonical `main`.
       * Unlocks - Engineer Core Roster revision.
       * Boundary - A validated branch does not satisfy this gate until its commit is confirmed on canonical `main`.

    3. **Engineer-owned Core Roster revision**

       * Input - The landed contract revision and completed consumer migrations.
       * Deliverable - Core Roster updated to the v2 contract without expanding role authority or moving permission ownership into Agent Compose.
       * Completion evidence - Canonical commit SHA, focused roster and composition tests, full repository validation, rendered-contract checks where required, and proof the commit is reachable from canonical `main`.
       * Unlocks - Fresh evaluation by AI Engineer.
       * Boundary - Evaluation cannot use pre-migration roster output or evidence generated before the final candidate commit.

    4. **AI Engineer-owned fresh evaluation and review evidence**

       * Input - Immutable commit set for AOS, all consumers, and Core Roster, plus the evaluation protocol and rubric.
       * Deliverable - Fresh raw model outputs and independent review artifacts generated from that exact commit set.
       * Completion evidence - Commit provenance, prompts or fixtures, model and transport metadata, raw outputs, reviewer outputs, scores, failures, and reproducible artifact locations. Evidence must be public-safe and must not contain credentials or mutable harness state.
       * Unlocks - QA verdict.
       * Boundary - Prior evaluations may provide context but cannot substitute for fresh evidence from the release candidate.

    5. **QA-owned independent verdict**

       * Input - The immutable candidate commit set and AI Engineer's complete raw evidence.
       * Deliverable - An independent pass, fail, or blocked verdict against explicit acceptance criteria.
       * Completion evidence - Criterion-by-criterion findings, traceable references to raw artifacts, regressions and unresolved risks, and a clear release recommendation. Missing or inconsistent provenance produces a blocked verdict.
       * Unlocks - DevOps release gate only on a passing verdict.
       * Boundary - QA evaluates the candidate and evidence. QA does not remediate, merge, release, or infer operational success.

    6. **DevOps-owned authorized release gate and after-state evidence**

       * Input - QA's passing verdict, the exact canonical commit set, release authorization, and the repository's established release procedure.
       * Deliverable - Gate decision, authorized release execution if approved, and verification of the resulting published state.
       * Completion evidence - Release workflow identity and result, released version and commit provenance, published artifact checks, metadata checks, and observed after-state evidence from approved operational surfaces.
       * Boundary - I do not infer release or deployment from a merge, a passing test, or a queued workflow. If the gate fails, DevOps records the failure and rollback or containment state, then returns the program to the owner of the failed prerequisite.

    Any branch found already merged and matching its required evidence will be marked complete rather than redispatched. Any validated but unmerged branch remains owned by its existing step owner until it lands through that repository's authorized workflow.
