- id: frontier-completion-coordinated-handoff
  question: |-
    Agent Compose v2 is accepted and its issues are ready to dispatch. The sequence is an AOS-owned contract revision, an Engineer-owned consumer migration, and an Engineer-owned Core Roster revision, followed by fresh AI Engineer evaluation evidence, an independent QA verdict, and an authorized DevOps release gate. Produce the ready-to-dispatch bounded outcomes, evidence checkpoints, exact handoffs, and final integration condition. Keep implementation with the execution roles and do not pause for more context or routine routing decisions. Speak in first person for your own actions. Do not claim work has run. Do not name or quote your role, personalities, or this evaluation.
  model: gpt-5.6-sol
  answer: |-
    I would dispatch six sequential, independently verifiable outcomes. Each owner receives only after the preceding checkpoint is satisfied.

    1. **AOS contract revision**

       * Owner - AOS Engineer
       * Outcome - Revise the AOS-owned capability or role-method contract required by Agent Compose v2. Keep reusable knowledge and ordinary skills in AOS. Do not copy person-package content or launcher policy into AOS.
       * Acceptance evidence - The canonical contract, schema or fixtures, consumer guidance, and compatibility expectations change together. AOS validation passes through its Ward surface. The change is committed and pushed under the repository's resolved workflow.
       * Handoff to Agent Compose Engineer - Exact landed commit, changed contract boundary, old-to-new field or behavior mapping, compatibility guarantees, and the validation command with its result.

    2. **Agent Compose consumer migration**

       * Owner - Agent Compose Engineer
       * Dependency - Accepted AOS contract revision is remotely available.
       * Outcome - Migrate Agent Compose's AOS consumer to the revised contract without importing AOS-owned sources. Preserve the input contract, immutable output bundle, single-person-package rule, and opaque manifest-plus-filesystem output.
       * Acceptance evidence - Focused tests cover the revised consumption path. Contract fixtures prove both native harness wrappers and staged-home adapters remain compatible. Failed refresh behavior still preserves the known-good bundle. `ward exec test` passes.
       * Handoff to Core Roster Engineer - Exact landed commit, consumed AOS contract version or commit, fixture changes, manifest impact, compatibility result for both delivery paths, and test result.

    3. **Core Roster revision**

       * Owner - Agent Compose Engineer
       * Dependency - Consumer migration is landed.
       * Outcome - Revise the embedded public-safe Core Roster and its person-owned bindings for v2. Keep the complete ordered personality activation, personality invariant, compatibility policy, and role methods determined by cross-role policy coherent. Do not generalize Kai-specific product content or alter execution authority.
       * Acceptance evidence - Schema, package layout, bundle fixtures, and rendered reference expectations agree. The external-package replacement path remains valid. No credentials, mutable harness state, private identity detail, or generated bundle artifacts enter the repository. `docs/FEATURES.md` changes only if the shipped capability boundary materially changes. `ward exec test` passes.
       * Handoff to AI Engineer - Exact landed commit, roster and policy deltas, unchanged invariants, affected evaluation scenarios, renderer result, and complete validation result.

    4. **Fresh evaluation evidence**

       * Owner - AI Engineer
       * Dependency - All three implementation commits are landed in the evaluation target.
       * Outcome - Produce fresh, commit-scoped evidence for the complete v2 integration. Prior evidence is not reusable as the acceptance basis.
       * Acceptance evidence - Evaluations identify the exact commit set, model transport, prompts, rubrics, raw results, scoring method, and reproducible invocation. Model traffic uses Agent Proxy. Only public-safe tracked material is sent. The renderer-verified `docs/evaluation-scores.md` is updated when required by the established evaluation workflow.
       * Handoff to QA - Immutable commit identifiers, evaluation artifact locations, commands, environment assumptions, complete results including failures, and the predefined acceptance thresholds.

    5. **Independent QA verdict**

       * Owner - QA
       * Dependency - Fresh evidence and all implementation artifacts are available.
       * Outcome - Independently verify the contract revision, both consumer paths, Core Roster behavior, safety invariants, and evaluation threshold. QA does not remediate implementation or iterate against live CI/CD.
       * Acceptance evidence - A commit-scoped verdict records each acceptance condition as pass, fail, or unverified, with supporting evidence. Any live-only verification need becomes an `interactive`-labeled issue naming the exact operator action and expected returning evidence.
       * Handoff to DevOps - Signed-off verdict record, reviewed commit set, validation and evaluation evidence, unresolved risks, release blockers, rollback boundary, and a clear gate recommendation derived from the verdict.

    6. **Authorized release gate**

       * Owner - DevOps
       * Dependency - QA verdict is passing, no required condition is unverified, and release authority is confirmed.
       * Outcome - Verify that the reviewed commits are the commits eligible for release, then allow the established Agent Compose release workflow to publish. A push to `main` uses the normal minor-release path. Patch or major selection requires authorized manual dispatch.
       * Acceptance evidence - Canonical `main` contains the reviewed commit set, the single-stage release workflow validates that set, and versioned cross-platform binaries plus Homebrew and Scoop metadata are published consistently. DevOps records release identifiers, artifact availability, and rollback coordinates.

    **Final integration condition**

    Agent Compose v2 is integrated only when the AOS contract revision, consumer migration, and Core Roster revision are all landed in dependency order, fresh AI Engineer evidence meets its stated thresholds, independent QA verifies the exact resulting commit set with no unresolved required condition, and authorized DevOps releases that same commit set through the established workflow. Any commit change after evaluation invalidates the downstream evidence and returns the sequence to fresh AI Engineer evaluation.
