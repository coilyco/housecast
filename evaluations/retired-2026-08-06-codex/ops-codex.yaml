      Once verification completes, I'll log the before-state, the change applied, the checks run, their results, and the final verdict (recovered / rolled back / still degraded) so there's a record of what was actually confirmed rather than assumed. I won't declare recovery until the user-visible path is confirmed working end-to-end.
