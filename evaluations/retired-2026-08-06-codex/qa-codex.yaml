- id: commodity-mission-strongest-claim
  question: |-
    An implementation claims a configuration migration is complete, rejects retired keys, preserves supported inputs, and remains idempotent. Build an independent verification approach around the strongest claim, including success, failure, and regression evidence, then state the verdict boundary. Speak in first person for your own actions. Do not invent repository results or runtime access. Do not name or quote your role, personalities, or this evaluation.
  model: claude-sonnet-5
  answer: |-
    I don't have access to the actual repository state, a diff, or a runtime environment for this task, so I can't run commands or inspect files right now. What I can do is lay out the verification plan I'd execute once given that access, so the approach itself is ready to run and the verdict boundary is clear up front.

    **Strongest claim to test first:** "rejects retired keys" — this is the highest-risk assertion, because a migration that silently *accepts* a retired key (rather than erroring) can corrupt downstream behavior invisibly. I'd anchor the plan there and treat the other three claims (preserves supported inputs, idempotent, "complete") as necessary supporting evidence.

    **Plan, in order of risk:**

    1. **Rejection of retired keys (failure path).** I'd need the actual list of retired keys from the migration diff/spec — not assumed. For each one, construct a minimal config containing only that key and run the migration against it. Expected: a deterministic error identifying the specific key, not a generic parse failure and not silent passthrough. I'd also test a config mixing one retired key among several valid ones, to confirm the retired key isn't masked by successful processing of the rest.

    2. **Preservation of supported inputs (success path).** Take a representative sample of currently-valid configs — ideally real ones pulled from the repo's fixtures/testdata rather than ones I invent — run them through the migration, and diff output against expected. I'd specifically include edge cases: empty/optional fields, keys with default values, and any key whose name or shape changed subtly during migration (rename vs. removal is where "complete" claims tend to be overstated).

    3. **Idempotency (regression path).** Run the migration twice on the same already-migrated config and diff the two outputs — they must be byte-identical, not just semantically similar. I'd also run it three times to rule out a two-cycle oscillation that a single re-run wouldn't catch.

    4. **"Complete" as a claim about coverage.** I'd cross-reference the retired-key list and supported-key list against the actual schema/resolver code, not just the migration's own test fixtures, since a migration's tests can pass while still missing a key the schema still parses elsewhere. If the repository has a contract fixture set (per this repo's `testdata/contracts` convention generally), I'd check whether the migration is exercised there or only in isolated unit tests — that gap itself would be a finding.

    **What would send it back as a defect:** any retired key that's silently accepted or produces a non-specific error, any supported input whose value changes unexpectedly, or any non-idempotent second pass.

    **Verdict boundary:** without the actual repository, its migration code, its retired-key list, and its fixture data, I can't produce a pass/fail — everything above is the reproducible method, not executed evidence. If you give me access (or paste the diff, the retired-key list, and representative fixtures), I'll run this and report which claims are demonstrated versus which remain open.
