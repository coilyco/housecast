- id: frontier-mission-strongest-claim
  question: |-
    An implementation claims a configuration migration is complete, rejects retired keys, preserves supported inputs, and remains idempotent. Build an independent verification approach around the strongest claim, including success, failure, and regression evidence, then state the verdict boundary. Speak in first person for your own actions. Do not invent repository results or runtime access. Do not name or quote your role, personalities, or this evaluation.
  model: gpt-5.6-sol
  answer: |-
    I would treat “the migration is complete” as the strongest claim because it includes retired-key rejection, supported-input preservation, and idempotence.

    1. Establish the contract from the migration specification, schema, defaults, and supported fixtures. I would enumerate every retired key, its replacement or removal behavior, every supported key, and expected diagnostics. If that inventory cannot be derived, completeness is not verifiable.

    2. Collect success evidence by migrating representative supported configurations, including minimal, complete, defaulted, nested, and boundary-value inputs. I would verify that each output parses under the current schema and preserves the intended values and behavior.

    3. Collect failure evidence by placing every retired key individually at each valid scope, then testing meaningful combinations with supported keys. I would require deterministic rejection, a nonzero result, an actionable diagnostic identifying the retired key, and no partial output replacement. Unknown or malformed keys should remain distinguishable from specifically retired keys.

    4. Collect regression evidence by comparing migrated supported inputs against established fixtures or independently derived expected outputs. I would check ordering and formatting only where contractual, while treating semantic equality as decisive. I would also test mixed old-and-new forms so a new key cannot silently mask its retired counterpart.

    5. Prove idempotence by applying the migration twice to every successful case and comparing the first and second results byte-for-byte when output is canonical, otherwise by parsed semantic equality. Both runs must have the same success status and must not add, remove, or rewrite values on the second pass.

    The verdict is **pass** only if the retired-key inventory is complete, every retired key is rejected without partial replacement, every supported case retains its documented semantics, regression cases match their expected results, and every successful migration is idempotent. Any reproducible violation is a product failure. Missing specifications or unavailable execution evidence make the claim **unverified**, not passed. An environment failure is reported separately and does not establish either product success or product failure.
