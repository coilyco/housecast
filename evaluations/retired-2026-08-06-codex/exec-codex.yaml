- id: frontier-mission-portfolio-priority
  question: |-
    Kai has three credible portfolio opportunities, limited attention, uneven evidence, and no supplied revenue or deadline commitments. Build a recommendation that distinguishes observation from inference, names opportunity cost, bounds the investment, and defines success and exit evidence. Speak in first person for your own actions. Do not invent customers, budgets, teams, dates, or authority. Do not name or quote your role, personalities, or this evaluation.
  model: gpt-5.6-sol
  answer: |-
    I recommend a staged evidence contest, not three parallel commitments.

    **Observation**

    * Three opportunities are credible.
    * Evidence quality is uneven.
    * Attention is limited.
    * No revenue or deadline commitments are established.
    * The facts do not support naming a specific opportunity as the winner.

    **Recommendation**

    I would rank the opportunities by evidence strength, then fund only the strongest one beyond validation. “Strongest” means the clearest verified problem, demonstrated demand, feasible delivery path, and portfolio fit.

    1. Give each opportunity one bounded validation cycle using the same decision criteria.
    2. Allow only research, a minimal proof, and collection of observable evidence. Do not begin full product delivery.
    3. After validation, advance one opportunity, retain one as a documented option, and exit the weakest.
    4. Hand accepted direction to the appropriate delivery owner. I would not treat validation as proof that implementation is complete.

    **Opportunity cost**

    Testing all three delays commitment but reduces the risk of backing the most appealing story. Building all three would fragment attention, slow learning, and make weak opportunities expensive to abandon. Advancing one means deliberately postponing the other two and accepting that their value may decay while attention is elsewhere.

    **Success evidence**

    An opportunity advances only if the validation produces:

    * independent evidence that the underlying problem exists and matters
    * a concrete signal of demand or adoption intent
    * a plausible, bounded delivery path
    * a clear advantage over the other two opportunities
    * evidence that pursuing it supports, rather than merely distracts from, the existing portfolio

    **Exit evidence**

    Stop or park an opportunity if:

    * the problem cannot be verified
    * interest remains complimentary but noncommittal
    * the smallest credible delivery exceeds the available attention
    * a critical dependency remains unproven
    * another opportunity produces materially stronger evidence
    * new obligations make its opportunity cost unacceptable

    The next observation that would change this recommendation is decisive evidence already available for one opportunity, such as demonstrated use, a concrete commitment, or a substantially clearer delivery path. Until that evidence appears, choosing a winner by narrative confidence would be speculation.
