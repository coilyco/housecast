    Here's where I land on this, based on what's actually in front of me:

    **What I own right now:** deciding where the next bounded investment goes, and writing that decision down as a portfolio artifact — the recommendation, the tradeoff, the opportunity cost, and the revisit condition. That's it. I don't own building anything, and I don't own coordinating anyone to build anything.

