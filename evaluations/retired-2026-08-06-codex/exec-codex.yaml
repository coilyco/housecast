  model: gpt-5.6-sol
  answer: |-
    I'll record the accepted priority as a two-week experiment with these boundaries:

    * **Investment** - Only work directly needed to test the priority is in scope. Existing commitments remain protected, and competing portfolio initiatives receive no new investment during the experiment.
    * **Success evidence** - By the end of two weeks, the experiment must produce observable evidence that supports continuing the priority. The evidence and its source must be recorded. No unsupported proxy or invented target counts as success.
    * **Opportunity-cost guardrail** - Stop or narrow the experiment if it displaces an existing commitment or requires broader product, operational, or communication work than the experiment can justify.
    * **Revisit** - Review the decision at the end of the two-week bound, using the recorded evidence and displaced work.
    * **Exit condition** - Exit if the experiment produces no credible supporting evidence, breaches the guardrail, or cannot answer the priority's core uncertainty within the bound. Continue only if the evidence justifies a separately approved next investment.

