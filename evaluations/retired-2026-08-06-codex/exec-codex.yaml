- id: commodity-mission-portfolio-priority
  question: |-
    Kai has three credible portfolio opportunities, limited attention, uneven evidence, and no supplied revenue or deadline commitments. Build a recommendation that distinguishes observation from inference, names opportunity cost, bounds the investment, and defines success and exit evidence. Speak in first person for your own actions. Do not invent customers, budgets, teams, dates, or authority. Do not name or quote your role, personalities, or this evaluation.
  model: claude-sonnet-5
  answer: |-
    Here's my recommendation on where to put attention next, working only from what's actually established.

    ## What I observe
    - There are three portfolio opportunities under consideration, commonly framed in the portfolio material as contracting, sponsorship, and SaaS/product work.
    - Evidence across them is uneven — some have more signal than others, but I have not been handed specific traction data, customer interest, revenue figures, or deadlines for any of the three.
    - Attention is limited: I cannot pursue all three at full intensity simultaneously.

    ## What I infer
    - Because evidence is uneven rather than absent, the gap in evidence is itself informative: it tells me which opportunities are still hypotheses and which have started to earn confirmation. Treating an evidence-light opportunity as equally validated as an evidence-rich one would be a mistake independent of which one is ultimately more valuable.
    - Given no committed revenue, team, or deadline, the near-term decision isn't "which one wins" — it's "which one is worth spending bounded attention on to convert hypothesis into evidence, without starving the others of a minimum maintenance level."

    ## What I don't know
    - I don't have the actual comparative signal strength across the three (which has real inbound interest vs. which is speculative).
    - I don't know current available capacity, so I can't state a real time budget.
    - I have no authorized budget, team, or deadline to attach to any of them, so I'm not inventing one.

    ## Recommendation
    I recommend a bounded, sequential evidence-gathering investment rather than a full commitment to any single opportunity right now:

    - **Primary focus**: the opportunity with the strongest existing observed signal (not speculation) gets the next dedicated attention slot. If that ranking isn't yet clear from current evidence, the first action is simply establishing which of the three has the strongest primary evidence — that's a prerequisite decision, not a detour.
    - **Opportunity cost**: time spent deepening one opportunity is time not spent validating or maintaining the other two. The two not selected get monitoring-only attention — enough to notice a change in signal, not enough to advance them.
    - **Bounded investment**: the investment stays capped at what's needed to produce a clear go/no-go signal, not an open-ended buildout. I'd rather spend a small, defined slice of attention and get a real answer than spread thin across all three indefinitely.

    ## Success evidence
    Success looks like the selected opportunity producing a concrete, unprompted signal that wasn't there before — e.g., unsolicited interest, a repeatable positive response, or some other externally verifiable indicator rather than my own optimism about the idea.

    ## Exit / revisit condition
    If the bounded investment period passes without that kind of independent signal, that's the exit condition — I deprioritize it back to monitoring-only and rotate attention to whichever of the other two now has the strongest observed (not inferred) evidence. I'm deliberately not attaching a calendar date to this since none has been authorized; the trigger is the evidence outcome itself, not a deadline.

    What would sharpen this immediately: the actual current signal for each of the three (what's been observed so far, not what's hoped for). Without that, I can commit to the framework and sequencing above, but I can't yet name which specific opportunity goes first.
