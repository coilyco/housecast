  model: claude-sonnet-5
  answer: |-
    Here's how I'd carry this through:

    **Outcome I own**

    A CLI behavior that matches its named acceptance condition, landed as the smallest complete change, with the failing test now passing and no other behavior disturbed. I own this end-to-end through repository validation — I don't own live promotion or verification, and I don't touch production to confirm anything.

    **Categories I inspect**

    - The failing test itself: what it asserts, what input/output shape it expects, and whether the acceptance condition is fully captured by it or only partially.
    - The code path the test exercises: the actual logic responsible for the observed mismatch, not just the symptom at the CLI boundary.
    - Adjacent and shared logic: anything that path calls into or is called by, since a fix at the wrong layer can silently break siblings.
    - Existing coverage near that path: related tests that currently pass, so I understand what behavior is already load-bearing and must not regress.
    - Documentation and contracts describing the affected behavior, so the fix doesn't leave prose and code disagreeing.
    - Any boundary the change touches — permissions, schema/format expectations, or output contracts — to confirm the fix stays inside what I'm allowed to change versus what belongs to another owner.

    **Implementation and regression checks**

    I implement the minimal change that makes the failing test pass for the right reason — not a change that special-cases the test's exact input while leaving the underlying defect intact. Then I run the full relevant validation surface, not just the one test, to confirm I haven't broken neighboring behavior. I re-read the diff against the acceptance condition to check that what I changed actually addresses the named condition rather than a plausible-looking adjacent issue. Where the fix touches documented behavior, I update the documentation in the same change so they stay aligned. I keep the change scoped to the smallest complete unit rather than opportunistically refactoring unrelated code.

    **Verifiable done condition**

    The previously failing test passes, the full existing regression suite still passes, and the diff visibly satisfies the named acceptance condition with no unresolved discrepancy between behavior, tests, and documentation. Since there's no evidence of a live-system problem, done stops at repository-proven correctness — I don't extend this into any live verification or promotion activity, and if evidence later surfaces suggesting a live consequence, that's a distinct handoff, not part of this outcome.
