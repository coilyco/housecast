cases:
  - id: frontier-mission-audience-loop
    question: |-
      An accepted portfolio experiment has verified product evidence, a target audience, three repeated community questions, one substantive expression of interest, and no customer, commitment, or publication result. Define the reusable proof, channel adaptations, community-state record, respectful contact path, qualification criteria, discovery evidence, and stop conditions as one connected audience loop. Speak in first person for your own actions. Do not invent targets, relationships, behavior, responses, terms, publication, or commercial state. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I would build the audience loop around the verified product evidence and the named target audience. The desired outcome is learning whether the product addresses a recurring, important problem. The three community questions and one substantive expression of interest are evidence of interest, not evidence of adoption, publication, commitment, or commercial demand. Unless explicitly authorized, I would prepare content and contact recommendations but neither publish nor send them.

      1. **Reusable proof**

         I would create one source-backed proof package containing:

         * The verified capability, its limits, and how it was verified.
         * A concise explanation mapped to the audience's problem.
         * A reproducible example or demonstration using only supplied evidence.
         * Answers to the three repeated questions, preserving distinctions between shipped behavior, planned work, and unknowns.
         * A provenance note linking every claim to its source and recording the evidence date.
         * A clear status statement: one substantive expression of interest, with no customer, commitment, publication result, or proven demand.

      2. **Channel adaptations**

         I would adapt that same proof without changing its claims:

         * **Community response** - a direct answer to each repeated question, followed by the relevant proof and an optional path to learn more.
         * **Long-form page or post** - the audience problem, verified capability, example, limitations, recurring questions, and a low-pressure invitation to discuss fit.
         * **Short update** - one verified outcome, one limitation, and a link or reference to the full proof.
         * **Private follow-up draft** - a personalized response only for the person who expressed interest, based solely on what that person actually said.

         Each adaptation would remain a draft until its exact channel and publication or sending action are authorized.

      3. **Community-state record**

         I would maintain a durable record with:

         * The three recurring questions, occurrence counts, source locations, dates, and whether each has a verified answer.
         * The substantive expression of interest, recorded in neutral language with its source and date.
         * The current classification: early audience signal, not a customer or commitment.
         * Content prepared, approvals pending, authorized actions, and any observed responses after authorized publication or contact.
         * Unanswered questions, objections, poor-fit indicators, and product-evidence gaps.

      4. **Respectful contact path**

         I would first answer in the originating community context if that is permitted and appropriate. For the substantive expression of interest, I would recommend a single contextual follow-up through the channel the person used. The message would acknowledge her stated interest, connect it to verified evidence, disclose relevant limitations, and ask whether she wants a short fit conversation. I would not move channels, add her to a list, repeatedly follow up, or send anything without explicit action-and-destination authorization.

      5. **Qualification criteria**

         I would treat interest as qualified only when evidence establishes:

         * The person belongs to, or closely represents, the target audience.
         * She has the problem described by the experiment.
         * The problem has meaningful frequency, consequence, or urgency.
         * The verified capability plausibly addresses her use case within its known limits.
         * She has a real evaluation path, such as access to the necessary workflow and involvement in the decision.
         * She voluntarily agrees to a concrete next step.

         Curiosity, praise, a repeated question, or a request for information alone would remain unqualified interest.

      6. **Discovery evidence**

         With authorized contact, I would seek and record the person's current workflow, triggering situation, consequences, alternatives, required outcome, constraints, decision participants, evaluation criteria, timing, and reasons the product might not fit. I would distinguish direct statements from my interpretations and would not infer budget, authority, urgency, usage, or willingness to commit.

      7. **Follow-through and stop conditions**

         After each authorized response or publication, I would classify observable outcomes as no response, informational reply, qualified discovery, poor fit, explicit decline, or a separately evidenced commitment. I would feed new recurring questions and objections back into the proof package only after verification.

         I would stop outreach when the person declines, asks not to be contacted, does not answer the authorized follow-up, falls outside the qualification criteria, or requires unsupported capabilities or terms. I would also pause the loop when claims lack verification, permission is missing, community rules prohibit the action, or continued contact would require inventing personalization, commercial status, or a commitment.
