    model: claude-sonnet-5
    answer: |
      Here's how I'd connect this experiment into one audience loop, using only what's verified so far:

      **Reusable proof**
      The verified product evidence from the experiment is the proof asset. I'd package it as a single artifact (a short writeup, demo, or before/after comparison — whichever format the evidence already exists in) so I'm not re-describing the work differently each time it's reused. I don't have shipped outcome data (adoption, results, customer usage) to add — only the verified capability itself, so the proof stays scoped to "this works, here's the evidence," not "this is being used."

      **Channel adaptations**
      Since I have three repeated community questions and one substantive expression of interest, I'd adapt the proof for two channels: the community space where the questions came from, and a direct reply to the interested person. Community version: answer the recurring question directly, then point to the reusable proof for depth. Direct-reply version: acknowledge their specific interest, share the proof, and ask what they're trying to solve rather than assuming fit. Same underlying facts, different framing per audience context — no new claims introduced for either.

      **Community-state record**
      I'd log: three instances of the same question recurring (signal of unmet need, not confirmed demand), one substantive expression of interest (a lead signal, not a customer), and explicitly note no commitment, no publication, and no customer exists yet. This keeps the record honest about being interest-stage, not traction-stage.

      **Respectful contact path**
      For the one interested party, the path is a direct, low-pressure reply acknowledging their question and offering the proof — not a pitch, not a follow-up sequence, and not outreach to anyone else who hasn't engaged. I don't have authorization to publish, post, or initiate contact beyond responding to the interest already shown, so I'd flag that any outbound action (posting the proof publicly, replying in the channel) needs your go-ahead on destination before I do it.

      **Qualification criteria**
      Before treating the one expression of interest as anything beyond a lead: I'd want to know what problem they're trying to solve and whether it maps to the verified evidence I have. Repeated community questions alone don't qualify as demand — they qualify as a documented pattern worth watching. Qualification should stay tied to their stated need matching real evidence, not to enthusiasm or recurrence alone.

      **Discovery evidence**
      The three repeated questions are the discovery signal — they tell me what the audience doesn't yet understand or what gap exists in current messaging. I'd treat that as input for what the reusable proof should clarify (i.e., the proof should preemptively answer that recurring question), not as evidence of scale or validated demand.

      **Stop conditions**
      I stop before: publishing anything publicly, contacting anyone who hasn't shown interest, framing the one lead as a customer or commitment, or characterizing three questions as validated market interest. If the interested party asks about pricing, availability, or terms, I stop and hand that off rather than answering, since no commercial state exists yet. Any move past "share proof, ask clarifying question" needs your explicit sign-off on the action and destination.

      **Next step**
      The concrete unblocked action is replying to the one interested person with the proof and a clarifying question — I'd need your confirmation on the contact destination before sending it.
