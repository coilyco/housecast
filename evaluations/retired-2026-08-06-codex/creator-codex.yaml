  - id: frontier-replay-agent-compose-creator-migration
    question: |-
      Agent Compose replaces four unnamed audience-facing roles with the canonical creator slug and Content Creator display name, preserves no compatibility aliases, and requires fresh evaluation evidence before release. Turn these verified facts into a migration-guide outline, release narrative, audience questions record, and bounded adoption follow-through. Keep the former slugs explicitly unknown. Separate the content artifacts you own from unresolved roster, configuration, schema, or behavior changes that Engineer owns, fresh evaluation execution that AI Engineer owns, and release or live-state evidence that its runtime owner supplies. Keep every publication separately authorized. Clearly separate landed behavior, unresolved downstream updates, and final release evidence. Speak in first person for your own actions. Do not invent merge, package, model, adoption, publication, or response results. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      ## Evidence boundary

      * **Verified behavior** - Agent Compose replaces four audience-facing roles with the canonical slug `creator` and display name `Content Creator`.
      * **Verified compatibility policy** - No compatibility aliases are preserved.
      * **Explicitly unknown** - The four former slugs are unnamed. I will not infer, reconstruct, or publish them.
      * **Release requirement** - Fresh evaluation evidence is required before release.
      * **Not established** - Merge status, package availability, downstream adoption, model results, publication, audience responses, and live release state.

      ## Migration-guide outline

      **Audience:** Agent Compose maintainers, configuration owners, integration maintainers, and users who select roles.

      **Outcome:** Help readers adopt `creator` without assuming compatibility or mistaking a prepared migration for a released change.

      1. **What changes**
         * Use the canonical slug `creator`.
         * Display the role as `Content Creator`.
         * Treat four former audience-facing role slugs as unknown.
         * Do not rely on aliases or automatic compatibility mapping.

      2. **Who needs to inspect downstream usage**
         * Configuration that selects a role by slug.
         * Rosters or role registries.
         * Schemas, validators, fixtures, and generated artifacts.
         * Automation or behavior branching on role identity.
         * Documentation and interface copy that name the role.

      3. **Migration procedure**
         * Inventory downstream references without guessing the former slugs.
         * Replace a reference only when its intended mapping to `creator` is verified.
         * Escalate ambiguous references instead of applying a broad textual substitution.
         * Validate roster, configuration, schema, and behavioral changes through their owning surfaces.
         * Obtain fresh evaluation evidence before release.
         * Confirm package and live release state from the runtime owner before describing the migration as available.

      4. **Compatibility warning**
         * No compatibility aliases are provided.
         * Consumers using an affected former slug may require an explicit update.
         * The affected former values remain unspecified until authoritative evidence names them.

      5. **Verification checklist**
         * Engineer confirms downstream implementation changes and prescribed validation.
         * AI Engineer supplies fresh evaluation results.
         * The runtime owner supplies release, package, rollout, and live-state evidence.
         * Release communication distinguishes completed implementation from verified availability.

      I own the guide's human-facing wording and structure. Engineer owns any roster, configuration, schema, identifier, validation, or behavior changes identified while preparing it.

      ## Release narrative draft

      Agent Compose standardizes four audience-facing roles under the canonical `creator` slug and the `Content Creator` display name. This change does not preserve compatibility aliases. The four former slugs are intentionally not listed because the available evidence does not identify them.

      Downstream consumers should verify role references before changing them. Roster, configuration, schema, and behavioral updates are not established by this narrative and remain with Engineer where required. Release remains conditional on fresh evaluation evidence from AI Engineer. Package availability, deployment, and live release status must be confirmed separately by the responsible runtime owner.

      This is a draft only. Publishing it as release notes requires explicit authorization for that destination. Publishing the migration guide, sending adoption outreach, and posting a community update each require separate authorization.

      ## Audience questions record

      No audience responses are recorded. These are prepared questions, not observed concerns.

      * **Maintainers** - Where is `creator` selected or validated in your integration?
      * **Configuration owners** - Do any current values depend on a former audience-facing slug? If so, what authoritative source identifies that value?
      * **Integration maintainers** - Would removing alias compatibility cause a startup, validation, routing, or selection failure?
      * **Documentation owners** - Which pages or interfaces present the role slug or display name to users?
      * **Release stakeholders** - What fresh evaluation evidence is required for the release decision, and where will that evidence be recorded?
      * **Runtime owner** - What evidence will establish package availability, rollout completion, and live state?
      * **Adopters** - What blocked, confused, or surprised you during migration?

      I would record answers with source, date, audience segment, confidence, unresolved question, and responsible owner. I would not classify silence as adoption or infer former slugs from unsupported responses.

      ## Bounded adoption follow-through

      1. I can prepare the migration guide and channel-specific release copy from the verified facts.
      2. Engineer inventories and implements any required roster, configuration, schema, identifier, validation, or behavior changes.
      3. AI Engineer runs the required fresh evaluations and records the evidence without my inferring a result.
      4. The runtime owner supplies package, release, rollout, and live-state evidence.
      5. After those inputs exist, I can update the narrative to separate:
         * landed behavior,
         * unresolved downstream work,
         * fresh evaluation results,
         * final release evidence.
      6. With separate explicit authorization for each destination, I can prepare publication-ready guide copy, release notes, an adoption announcement, or audience outreach.
      7. I can classify authorized responses as migrated, blocked, ambiguous, poor fit, or awaiting evidence. I will not claim adoption without recorded responses or verified downstream state.
