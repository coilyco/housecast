- id: frontier-completion-model-field
  question: |-
    A model field has finished execution, but provenance checks, aggregation, leaderboard regeneration, documentation, repository validation, commit, and resolved delivery remain. Carry the AI-engineering artifact through those steps, preserving raw responses, retries, exact model and runtime identity, source revision, pack digest, criterion evidence, and failures. State the full ordered follow-through and the exact evidence produced by each step. Do not stop at inspection, defer the remaining artifact work to an unspecified owner, or describe an unfinished result as a pass. Do not claim any unfinished step passed. Do not name or quote your role, personalities, or this evaluation.
  model: gpt-5.6-sol
  answer: |-
    1. **Seal the completed execution output.** Preserve every raw response byte-for-byte, including unsuccessful attempts, partial outputs, timeouts, and error payloads. Record the retry sequence without replacing earlier attempts.

       Evidence produced: immutable raw-response files, per-attempt identifiers, timestamps, exit states, failure records, and checksums.

    2. **Verify provenance.** Bind each attempt to the exact model identifier, provider or endpoint identity, runtime and executor versions, inference parameters, source revision, evaluation-pack digest, prompt and context digest, and retry lineage. Reject or mark incomplete any record whose identity cannot be proven.

       Evidence produced: a provenance manifest, digest verification results, retry graph, and explicit provenance failures.

    3. **Classify execution failures.** Separate prompt, model, runner, substrate, and specification failures. Keep excluded or unscorable attempts visible and explain their treatment. Do not silently convert failures into zeroes or omit them.

       Evidence produced: per-attempt failure classifications, exclusion reasons, and counts reconciled against the raw execution inventory.

    4. **Score criterion evidence.** Evaluate each criterion against cited portions of the preserved response. Record the expected condition, observed evidence, score, and rationale. Mark missing or ambiguous evidence as unresolved or failed according to the existing scoring policy.

       Evidence produced: criterion-level score records with raw-response references, rationales, and unresolved cases.

    5. **Aggregate from verified records.** Run the repository-owned aggregation over only provenance-valid, policy-eligible records. Reconcile input counts, exclusions, failures, retries, denominators, and totals. Preserve the generated intermediate data.

       Evidence produced: aggregation inputs, intermediate results, final summaries, reconciliation counts, and aggregation diagnostics.

    6. **Regenerate the leaderboard.** Rebuild rankings from the aggregate output using the established tie, failure, and retry policies. Confirm that every displayed value traces back to criterion evidence and a raw attempt.

       Evidence produced: regenerated leaderboard artifacts, ranking inputs, tie-resolution records, and traceability from each leaderboard value to its source evidence.

    7. **Regenerate repository documentation.** Update the renderer-verified `docs/evaluation-scores.md` and any required evaluation documentation from the same derived data. Do not hand-edit generated results or update `docs/FEATURES.md` unless a significant capability actually shipped.

       Evidence produced: reproducibly rendered documentation and a diff that agrees with the aggregate and leaderboard artifacts.

    8. **Run repository validation.** Execute `ward exec test`, which covers Go tests and repository hooks. If it fails, preserve the exact failure output, correct in-scope artifact defects, regenerate affected evidence, and rerun. No validation pass exists until the command completes successfully.

       Evidence produced: the exact command result, test and hook output, exit status, and any failure-to-fix history.

    9. **Review the final artifact boundary.** Confirm raw responses remain preserved, generated-only files remain uncommitted except `docs/evaluation-scores.md`, no credentials or private deployment data entered the artifact, and the commit contains only the evaluation slice.

       Evidence produced: final inventory, tracked-file diff, provenance-to-score-to-leaderboard reconciliation, and safety review result.

    10. **Commit the verified slice.** Create one commit containing the eligible source records, provenance, scoring and aggregation artifacts, leaderboard output, and documentation. Record the source revision and resulting commit identity. Never bypass hooks.

        Evidence produced: commit hash, committed file list, commit diff, and hook result.

    11. **Complete resolved delivery.** Follow the repository's already-resolved workflow. Push directly to canonical `main` when authorized, or push the task branch and complete the required Forgejo PR and merge gates. Verify the remote commit rather than treating a local commit as delivery.

        Evidence produced: remote branch and commit identity, push result, PR and review evidence when required, merge commit when applicable, and confirmation that canonical `main` contains the delivered artifact.

    Until each corresponding step completes with its stated evidence, that step remains unfinished and must not be reported as passed.
