- id: frontier-mission-layered-agent-failure
  question: |-
    A local agent sometimes gives an incomplete answer. Turn the report into a layered investigation across instructions, context construction, model capability, inference runtime, hardware constraints, and observed behavior. State the claim, variables to freeze, correctness rule, and evidence required before changing a layer. Do not assume the prompt is the cause or invent model, runtime, hardware, or benchmark results. Do not name or quote your role, personalities, or this evaluation.
  model: gpt-5.6-sol
  answer: |-
    The working claim is: under a defined task and execution configuration, the local agent sometimes omits information required for a correct answer. “Sometimes incomplete” is not yet evidence that any particular layer is defective.

    Freeze unrelated variables before comparing runs:

    * Exact user request, system instructions, instruction order, and decoding parameters
    * Context sources, versions, selection rules, ordering, and token budget
    * Model identifier, weights, quantization, and tokenizer
    * Runtime version, backend, configuration, and retry behavior
    * Hardware, resource limits, concurrency, and system load
    * Executor, tool availability, timeouts, output limits, and stop conditions
    * Correctness rubric and scoring procedure

    Define correctness before execution. An answer is complete only if it contains every independently required rubric item, respects all constraints, and is not truncated. Record each missing item separately. Do not classify answers through overall impression alone.

    Investigate from observed behavior toward the lowest owning cause:

    1. **Observed behavior**

       Preserve the exact input, assembled context, raw output, timestamps, stop reason, token counts, errors, retries, and rubric result for every run. Reproduce the failure across repeated, identically configured trials. If the report cannot identify the missing requirement or reproduce the omission, improve the report and evaluator before changing the agent.

    2. **Instructions**

       Check whether the required content is explicitly requested, internally consistent, correctly prioritized, and reachable within the instruction hierarchy. Change instructions only when the omission follows an ambiguity, conflict, missing requirement, or demonstrated sensitivity to a controlled instruction-only variation.

    3. **Context construction**

       Inspect the final context actually delivered to the model, not merely the intended sources. Verify inclusion, ordering, deduplication, truncation, scope selection, and provenance. Change context construction only when required information is absent, corrupted, displaced, or predictably lost because of the construction process.

    4. **Model capability**

       Hold the prompt, constructed context, runtime, hardware, and executor fixed. Use representative cases with predefined expected answers and compare repeated results against an appropriate control model or configuration. Change the model only when evidence shows the current model cannot reliably satisfy the contract despite valid instructions, intact context, and stable execution.

    5. **Inference runtime**

       Check stop reasons, output caps, context-window accounting, decoding settings, tokenizer compatibility, request serialization, batching, cancellation, and retry provenance. Change the runtime only when traces connect the incomplete output to runtime behavior, or a controlled runtime-only comparison removes the failure.

    6. **Hardware constraints**

       Measure memory pressure, allocation failures, throttling, device fallback, process termination, and other resource saturation during the failing runs. Change hardware or resource limits only when measurements correlate the omission with a constraint and the same frozen workload succeeds after that constraint alone is relieved.

    For every experiment, retain the exact provenance, raw responses, rubric decisions, and retry history. Classify each failure as an instruction, context, model, runtime, hardware, executor, evaluator, or specification defect. If the evidence does not isolate one layer, report the result as unresolved and run the smallest controlled comparison that distinguishes the remaining hypotheses.
