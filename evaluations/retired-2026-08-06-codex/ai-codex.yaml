  answer: |-
    Here is the full ordered follow-through required to carry this model field from finished execution to resolved delivery, with the exact evidence each step must produce. None of these steps have been run yet — nothing below is a pass.

    **1. Provenance verification**
    Confirm and record, per response: exact model identifier and version, runtime/inference configuration, hardware substrate, source revision (commit/pack SHA) the prompt and context were built from, and pack digest. Confirm each retry is attributed to its originating attempt, not silently merged. Evidence produced: a provenance record per response (model id, runtime id, hardware id, source revision, pack digest, retry index) with any mismatches flagged as defects, not discarded.

    **2. Raw-response preservation**
    Store the unmodified raw output and retry chain for every case, keyed to its provenance record, before any scoring or transformation touches it. Evidence produced: an immutable raw-response set, one entry per attempt including failed and retried attempts, with no overwrite of a prior raw capture.

    **3. Criterion scoring and evidence capture**
    Apply the defined correctness criteria to each raw response and record the specific evidence (matched/unmatched criterion, quote or artifact from the response) that justifies each score. Evidence produced: a per-case, per-criterion evidence table showing which criteria passed, which failed, and the supporting excerpt for each determination — with failures classified as prompt, model, runner, substrate, or specification defects rather than left unclassified.

    **4. Aggregation**
    Combine per-case criterion results into case-level and suite-level scores using the stated scoring policy, keeping failure counts and defect classifications intact rather than collapsing them into a single number. Evidence produced: an aggregation output (score table plus failure/defect breakdown) traceable back to the per-criterion evidence from step 3.

    **5. Leaderboard regeneration**
