- id: commodity-mission-layered-agent-failure
  question: |-
    A local agent sometimes gives an incomplete answer. Turn the report into a layered investigation across instructions, context construction, model capability, inference runtime, hardware constraints, and observed behavior. State the claim, variables to freeze, correctness rule, and evidence required before changing a layer. Do not assume the prompt is the cause or invent model, runtime, hardware, or benchmark results. Do not name or quote your role, personalities, or this evaluation.
  model: claude-sonnet-5
  answer: |-
    # Investigation Plan: Incomplete Answer from Local Agent

    ## Claim under test

    "The local agent sometimes gives an incomplete answer" — currently a symptom report, not a diagnosis. No layer is yet implicated. I have no reproduction transcript, no raw response log, and no environment facts, so nothing below is a conclusion; it is the structure needed to produce one.

    ## Correctness rule (define before touching anything)

    Before any evidence collection, "complete" needs an operational definition, or every subsequent layer test is unfalsifiable:

    - What does the answer need to contain to count as complete (all requested sub-items addressed, no truncation mid-token, no premature stop, correct final state reached)?
    - Is completeness judged against the prompt's explicit ask, or against an implicit expectation the user held but didn't state?
    - Is "sometimes" measured (e.g., N/50 runs) or anecdotal (one or two observed instances)?

    Without this, "incomplete" could mean truncated output, a skipped sub-task, a wrong-but-full answer misread as partial, or a correct answer that simply omitted something the user assumed was included.

    ## Variables to freeze

    To attribute cause to one layer, hold the rest constant across repeated trials:
    - Exact prompt/instruction text and context payload (byte-identical, not paraphrased)
    - Model identifier and version/checkpoint
    - Runtime/inference settings (max output tokens, stop sequences, temperature, timeout, streaming vs. batch)
    - Hardware/resource conditions (memory, VRAM/quantization, concurrent load)
    - Executor/harness version issuing the call

    Changing more than one of these between trials makes the result uninterpretable.

    ## Layered evidence required before diagnosing or changing anything

    1. **Instructions** — Does the instruction set explicitly request the full scope the user expected, or is scope ambiguous/underspecified? Evidence: the exact instruction text plus a scope checklist derived from it.
    2. **Context construction** — Was all necessary source material actually present in the assembled context, or was something omitted/truncated before the model ever saw it (context window overflow, retrieval miss, silent truncation during assembly)? Evidence: the materialized context payload as sent, with size/token accounting.
    3. **Model capability** — Does this class of task exceed the model's demonstrated capability on comparable inputs? Evidence: repeated trials on the same task with the same model, scored against the correctness rule.
    4. **Inference runtime** — Was the response cut off by a token limit, stop sequence, timeout, or streaming interruption rather than the model choosing to stop? Evidence: raw response object including finish/stop reason, token counts, and any runtime error or truncation flag.
    5. **Hardware constraints** — Did local resource limits (memory pressure, quantization, throttling, swap) coincide with the incomplete runs? Evidence: resource logs from the same time window, correlated against pass/fail trials — not assumed from "it's local."
    6. **Observed behavior** — Aggregate raw outputs across trials, classify each failure by which layer's evidence implicates it (prompt defect, context defect, model limit, runtime cutoff, hardware constraint), and report the distribution rather than a single cause.

    ## What I don't have yet

    I don't have a transcript, raw response with finish reason, repeated-trial data, or resource logs. I can't attribute this to the prompt, the model, or hardware without that evidence, and I won't guess.

    ## Handoff

    To proceed, I need: (1) the exact prompt/context sent, (2) the raw response including stop/finish reason, (3) at least a few repeated trials under frozen conditions, and (4) the user's concrete definition of "incomplete." Whoever holds execution access to the local runtime should capture those four before any instruction or context change is attempted — otherwise a fix would be unverifiable.
