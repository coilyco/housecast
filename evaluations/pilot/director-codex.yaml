  - id: frontier-replay-v2-program
    question: |-
      Agent Compose v2 requires an AOS ownership move, infrastructure consumer migration, Core Roster revision, fresh evaluations, and release gates in that order. Several repository branches are validated but not all may land yet. Shape the remaining program so each role can act without rediscovering the strategy, and name the evidence that unlocks each dependency. Speak in first person for your own actions. Do not invent merge, CI, release, or deployment state. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I'm setting one governing rule: **validation is necessary, but it does not grant landing authority**. Downstream branches remain remote checkpoints until their predecessor gate closes. Any validation performed before an upstream ownership or roster change must be repeated against the final integrated commit when that change could affect the result.

      Current landing, CI, release, and deployment state are unknown because the workspace contains no repository or branch evidence.

      ## Program sequence

      ### 1. AOS ownership move

      **Outcome:** AOS becomes the canonical owner of agent-compose inputs, harness selection, deployment identity, roster defaults, and standalone AOSguard policy. Ward retains fixed workflows and its broker. Infrastructure remains a consumer.

      **Owner:** AOS engineer.

      **Required work:**

      * Move the authoritative implementation and configuration into AOS.
      * Remove or clearly demote authoritative copies in the former owner.
      * Ensure shipped tools do not fetch runtime configuration downward from a reference or infrastructure repository.
      * Update AOS feature documentation if the public capability boundary materially changes.
      * Validate through AOS-owned loaders, schemas, renderers, or doctor surfaces. Do not create consumer tests that reinterpret the configuration.

      **Evidence unlocking infrastructure migration:**

      * Exact AOS repository, branch, and immutable commit SHA.
      * Diff showing the new canonical sources and removal or demotion of old authority.
      * Passing AOS validation commands and results.
      * Compatibility contract for consumers, including version or commit reference and generated-output behavior.
      * Documentation of the ownership boundary.
      * Workflow record proving the branch is allowed to land.
      * Commit present on canonical main. A merely validated branch does not close this gate.

      **Escalation:** Kai decides only if the proposed move changes the AOS, Ward, or infrastructure ownership boundary described above.

      ### 2. Infrastructure consumer migration

      **Outcome:** Infrastructure consumes the landed AOS contract without retaining an independent implementation or source of truth.

      **Owner:** Infrastructure engineer. Ops owns any later live rollout, not repository migration.

      **Entry condition:** Gate 1 evidence is complete and the AOS ownership commit is on canonical main.

      **Required work:**

      * Replace legacy references, copied configuration, or former ownership paths with the landed AOS interface.
      * Preserve infrastructure-owned deployment values and host-specific preferences at their proper layers.
      * Use the established rollout mechanism. Do not place fleet-wide mutation in `ward setup` or installation hooks.
      * Validate repository behavior locally through Ward.
      * Avoid deployment or live CI experimentation from the engineering lane.

      **Evidence unlocking Core Roster revision:**

      * Exact infrastructure repository, branch, and immutable commit SHA.
      * Dependency reference to the landed AOS ownership commit or released interface.
      * Search evidence showing obsolete authoritative copies or references are gone.
      * Passing Ward validation for the affected consumer paths.
      * Migration and rollback description for the eventual operator.
      * Workflow record proving the branch may land.
      * Commit present on canonical main.

      **Escalation:** If migration exposes a missing AOS interface, work returns to Gate 1. Infrastructure must not recreate the missing authority locally.

      ### 3. Core Roster revision

      **Outcome:** The Core Roster is revised on top of the final ownership and consumer boundaries, with role responsibilities, defaults, and composition inputs internally consistent.

      **Owners:** Director for the bounded portfolio decision, AOS engineer for implementation, AI engineer for evaluation requirements.

      **Entry condition:** Gate 2 evidence is complete and the infrastructure migration commit is on canonical main.

      **Required work:**

      * Record the intended roster membership and responsibility boundaries.
      * Make deployment identity, model selection, attribution, and roster defaults explicit in their AOS-owned inputs.
      * Preserve the rule that personality does not alter authority, safety, or acceptance criteria.
      * Update generated outputs through the owning renderer.
      * Validate composition and generated artifacts without hand-editing generated copies.

      **Evidence unlocking fresh evaluations:**

      * Approved roster decision record containing additions, removals, changed responsibilities, and deliberately unchanged boundaries.
      * Exact AOS commit SHA containing the revision.
      * Generated-bundle diff traceable to canonical inputs.
      * Passing composition, schema, and repository validations.
      * Evidence that infrastructure still consumes the resulting contract without acquiring ownership.
      * Commit present on canonical main.

      **Escalation:** Kai chooses only when roster alternatives change portfolio responsibility, authority, or a meaningful human commitment. Mechanical consistency fixes remain with the engineer.

      ### 4. Fresh evaluations

      **Outcome:** The integrated v2 state is evaluated after all three predecessor changes, not inferred from earlier branch-level results.

      **Owner:** AI engineer for execution and evidence. QA independently assesses the result.

      **Entry condition:** Gate 3 is complete. The evaluation target is an immutable integrated commit containing the landed ownership move, consumer migration, and roster revision.

      **Required evidence:**

      * Evaluated repository and commit SHAs.
      * Frozen role bundles, prompts, rubrics, fixtures, and evaluator versions or fingerprints.
      * Model and transport identity, with model traffic routed through Agent Proxy where required.
      * Raw results plus summarized metrics.
      * Independent review evidence.
      * Comparison against an explicitly named baseline.
      * Failure analysis for regressions, including whether each failure is product behavior, evaluation noise, or an infrastructure problem.
      * Reproduction instructions using repository-approved Ward verbs.
      * QA verdict stating pass, fail, or inconclusive against predetermined acceptance thresholds.

      **Evidence unlocking release gates:**

      * All required evaluation suites completed against the same integrated candidate.
      * Acceptance thresholds met.
      * No unexplained critical regression.
      * Any accepted deviation has a named decision owner, bounded impact, and revisit trigger.
      * QA verdict references immutable evidence rather than live experimentation.

      A failed or inconclusive evaluation returns work to the owning phase. The revised candidate must repeat affected downstream validation and evaluations.

      ### 5. Release gates

      **Outcome:** A release candidate is either authorized, rejected, or held with a precise missing condition. Passing this phase does not itself prove that a release or deployment occurred.

      **Owners:** QA supplies the independent verdict. Ops verifies release readiness and performs any authorized release or rollout. Director resolves only cross-project tradeoffs.

      **Entry condition:** Gate 4 evidence is complete and passing.

      **Required gates:**

      * Candidate SHA matches the evaluated integrated SHA.
      * Repository validation and required CI checks have verifiable passing evidence.
      * Release workflow, versioning impact, and affected publication trains are identified.
      * Secret scanning and applicable pre-commit validation have passed.
      * Rollback target and rollback conditions are recorded.
      * Release authority and repository workflow permit the action.
      * Any deployment uses an established precedent and has a separate operator-owned verification plan.
      * Post-release evidence requirements are named before release execution.

      If any item lacks evidence, the state is **held**, not “probably ready.”

      ## Branch handling

      I would classify every existing branch into one of four lanes:

      * **Active-phase candidate** - It belongs only to the current gate. It may land after its evidence bundle and workflow authority are verified.
      * **Downstream checkpoint** - It is validated but depends on an unfinished gate. Keep it on a pushed remote branch. Rebase and revalidate after its dependency lands.
      * **Mixed-phase branch** - It combines work from different gates. Split it so landing order remains enforceable.
      * **Unproven branch** - It lacks an immutable SHA, validation record, dependency base, or workflow authority. Treat it as not ready.

      No downstream branch should land early merely to save rebasing effort. That would erase the dependency order the program is meant to prove.

      ## Role-ready handoffs

      * **AOS engineer** - Close Gate 1 with the ownership commit and evidence bundle.
      * **Infrastructure engineer** - Begin only from the landed Gate 1 contract. Close Gate 2 without recreating AOS authority.
      * **Director** - Close the bounded Core Roster decision after Gate 2. Escalate only responsibility or authority forks.
      * **AOS engineer** - Implement and land the approved roster revision.
      * **AI engineer** - Run fresh evaluations against the immutable integrated candidate.
      * **QA** - Independently judge the evaluation and release evidence. Do not remediate or probe live systems.
      * **Ops** - Verify release gates and execute only an authorized release or rollout.
      * **Content Creator** - Own any later human-facing announcement, release-note recommendation, or messaging decision. The factual handoff is the verified commits, evaluation verdict, known limitations, and release state.

      ## Immediate next action

      The AOS engineer should produce the branch ledger first: repository, branch, SHA, phase, base commit, validation evidence, workflow authority, dependency, and whether the commit is actually on canonical main. That ledger will reveal which validated branch can land now and which branches must remain held without requiring Kai to revisit the strategy.
