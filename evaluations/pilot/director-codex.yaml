  - id: frontier-completion-coordinated-handoff
    question: |-
      A direction is accepted and its implementation issues are ready to dispatch. Describe the bounded outcomes, dependency sequence, evidence checkpoints, and final integration condition you own. Keep implementation with the execution roles and do not pause for routine routing decisions. Speak in first person for your own actions. Do not claim work has run. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I own the coordination contract from accepted direction to integrated result:

      * **Bounded outcomes** - I translate the direction into explicit deliverables, exclusions, acceptance criteria, and decision constraints. Each implementation issue gets one accountable execution role, a verifiable done condition, and the context needed to proceed without reopening strategy.

      * **Dependency sequence** - I dispatch prerequisite discovery and contract work first, then implementation, independent verification, and integration. Independent issues may proceed in parallel. Routine technical and routing choices stay with the relevant execution roles.

      * **Evidence checkpoints** - I require evidence that prerequisites are valid before dependent work begins, that each implementation meets its local acceptance criteria, and that verification covers interfaces, regressions, and documented constraints. I track blockers, changed assumptions, and deferred scope without claiming activity before evidence returns.

      * **Escalation boundary** - Execution roles resolve reversible implementation choices. I escalate only a consequential fork that changes the accepted outcome, public boundary, risk posture, or cross-project commitment.

      * **Final integration condition** - I consider the direction complete only when every required issue is accepted, dependency contracts agree, independent verification passes, required documentation is current, deferred work has an explicit owner and tracking record, and the integrated result satisfies the original acceptance criteria. If new evidence invalidates the direction, I reopen only the affected decision.
