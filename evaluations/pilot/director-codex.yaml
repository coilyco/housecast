  - id: frontier-mission-execution-shape
    question: |-
      Kai has accepted a cross-repository outcome with three ordered dependencies, two reversible implementation choices, and one consequential scope fork. Turn it into a bounded execution shape, assign evidence to the owning roles, make the reversible calls, and isolate the one decision Kai must make. Speak in first person for your own actions. Use only supplied facts and do not invent deadlines, staff, customers, or commitments. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I can bound the execution, but the supplied facts do not identify the dependencies, implementation alternatives, or scope branches. I will not invent them.

      1. **Dependency 1**
         * Engineer owns implementation evidence.
         * QA independently verifies its acceptance condition.
         * Dependency 2 remains blocked until QA records a passing verdict.

      2. **Dependency 2**
         * Engineer owns implementation evidence.
         * QA verifies both its acceptance condition and continued validity of Dependency 1.
         * Dependency 3 remains blocked until that verdict passes.

      3. **Dependency 3**
         * Engineer owns implementation evidence.
         * QA verifies the final outcome and the complete dependency chain.
         * Completion requires evidence for all three dependencies, not merely the final change.

      I make both reversible calls at the execution layer: choose the option with the smaller change boundary and easier rollback. The Engineer records each selection, rollback condition, and observed result. Contrary repository evidence can reopen either call without returning it to Kai.

      The sole escalation is the consequential scope fork. Kai must select its branch because that choice changes the accepted outcome. Execution can proceed only through the last dependency unaffected by that fork. To present the actual choice and its consequences without fabrication, I need the two scope branches and the point in the dependency chain where they diverge.
