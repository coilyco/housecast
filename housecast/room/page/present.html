<!doctype html>
<html lang="en" class="present" data-ground="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>presenter</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="coilyco-kit.css">
<link rel="stylesheet" href="room.css">
<style>
  .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem; padding: 0.8rem 1.25rem; background: var(--k-surface); border-bottom: 2px solid var(--k-brand); }
  .bar .status { margin-left: auto; font-size: 0.9rem; }
  .banner { order: -2; }
  #round-panel { order: -1; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 1.25rem; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .incoming { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
  .incoming button { width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.3rem 0.8rem; padding: 0.6rem 0.8rem; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .incoming button[aria-current="true"] { border-color: var(--presenter); box-shadow: inset 4px 0 0 var(--presenter); }
  .incoming .score { font-family: var(--mono); font-weight: 700; }
  .chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; font-size: 0.85rem; color: var(--dim); }
  .chip { display: inline-flex; gap: 0.3em; align-items: center; }
  .chip .logo { width: 1.5em; height: 1.5em; }
  .roles { flex-direction: column; flex-wrap: nowrap; gap: 0.15rem; }
  .roles .chip { display: flex; justify-content: space-between; padding: 0.1rem 0; border: 0; border-radius: 0; color: var(--text); font-weight: 400; letter-spacing: 0; text-transform: none; }
  .roles .chip__state { color: var(--dim); }
  .sort { display: flex; gap: 0.4rem; }
  .sort .k-btn[aria-pressed="true"] { border-color: var(--k-brand); color: var(--k-text); }
  .case-controls { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .gate { max-width: 30rem; }
</style>
</head>
<body class="present k-page">
<p class="demo-chip" id="demo-chip" hidden>demo data</p>

<form class="wrap gate" id="gate" hidden>
  <p class="eyebrow eyebrow--live">presenter</p>
  <h1>Presenter token</h1>
  <p class="dim" id="gate-why">The room prints this token when it starts. It stays in this browser.</p>
  <label class="field">Token<input class="k-input" id="gate-token" type="password" autocomplete="off" required></label>
  <button class="pick k-btn k-btn--primary" type="submit">Open the presenter surface</button>
</form>

<div id="surface" hidden>
  <header class="bar">
    <p class="eyebrow eyebrow--live" id="phase-label"></p>
    <button class="next k-btn k-btn--primary" id="next" type="button"></button>
    <button class="next k-btn k-btn--primary" id="pick-next" type="button" hidden></button>
    <button class="next k-btn k-btn--primary" id="finish" type="button" hidden>Finish: show the eval table</button>
    <button class="k-btn k-btn--ghost" id="reasons-toggle" type="button"></button>
    <p class="dim" id="reasons-state" role="status"></p>
    <p class="status" id="status" role="status"></p>
  </header>
  <main class="wrap k-dense" style="max-width:90rem">
    <p class="banner" id="banner" role="status" hidden></p>
    <section class="panel" id="cases-panel" aria-labelledby="add-title">
      <h2 id="add-title">Add cases</h2>
      <p class="dim">A case is answered ahead of time and stays hidden from the room until you pick it.</p>
      <div class="field">
        <label for="case-text" class="dim">Add a case</label>
        <textarea class="k-textarea" id="case-text"></textarea>
        <button class="pick k-btn k-btn--primary" id="case-add" type="button">Add this case</button>
      </div>
      <p class="note" id="case-note" role="status" hidden></p>
    </section>
    <div class="cols">
      <section class="panel" aria-labelledby="incoming-title">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap">
          <h2 id="incoming-title">Cases</h2>
          <div class="sort" role="group" aria-label="Sort prompts">
            <button class="k-btn k-btn--ghost" type="button" data-sort="order" aria-pressed="true">In order</button>
            <button class="k-btn k-btn--ghost" type="button" data-sort="divergence" aria-pressed="false">Most different</button>
            <button class="k-btn k-btn--ghost" type="button" data-sort="newest" aria-pressed="false">Newest</button>
          </div>
          <button class="k-btn k-btn--ghost" type="button" id="cases-download" disabled>Download cases as JSON</button>
        </div>
        <ul class="incoming" id="incoming"></ul>
      </section>
      <section class="panel" aria-labelledby="detail-title" id="detail">
        <h2 id="detail-title">Pick a case to read its four answers</h2>
        <p class="dim" id="detail-meta"></p>
        <div id="detail-case"></div>
        <div class="answers" id="detail-answers"></div>
        <div id="detail-jev"></div>
        <button class="pick k-btn k-btn--primary" id="pick" type="button" hidden></button>
        <div class="case-controls" id="case-controls" hidden>
          <button class="k-btn k-btn--ghost" type="button" id="case-run">Run this case again</button>
          <button class="k-btn k-btn--ghost" type="button" id="case-delete">Delete this case</button>
        </div>
      </section>
    </div>
    <section class="panel" id="round-panel" aria-labelledby="round-title" hidden>
      <h2 id="round-title"></h2>
      <p class="dim" id="round-meta"></p>
      <div class="split" id="round-split"></div>
      <div id="round-eval"></div>
      <ul class="failures" id="round-failures"></ul>
    </section>
  </main>
</div>

<script src="room.js"></script>
<script src="views.js"></script>
<script>
"use strict";
const { promptById, answerFor, seconds, escapeHtml, postJson, SHOW_PROPOSALS, CASE_MAX } = window.Room;
const V = window.RoomViews;
const $ = (id) => document.getElementById(id);

const demo = Boolean(new URLSearchParams(location.search).get("demo"));
let token = null;
let room = null;
let link = { live: true };
let selected = null;
let sort = "order";

// A token in the address is taken once and dropped from the URL bar. It is kept
// in localStorage, so a reload, a crashed tab, or a new tab keeps control.
function keepToken(value) {
  try { localStorage.setItem("room-token", value); } catch {}
}
(function takeToken() {
  const fromHash = new URLSearchParams(location.hash.slice(1)).get("token");
  if (fromHash) {
    keepToken(fromHash);
    history.replaceState(null, "", location.pathname + location.search);
  }
  try { token = fromHash ?? localStorage.getItem("room-token"); } catch { token = fromHash; }
})();

/** Past the measured p95 of 43s, with room to spare, a stuck subject stops holding the pick. */
const PICK_ANYWAY_S = 75;

const NEXT = {
  holding: { label: SHOW_PROPOSALS ? "Open proposals" : "Show the join address", to: "submissions" },
  submissions: { label: "Pick a case to start grading", to: null },
  grading: { label: "Close grading, show the results", to: "split" },
  split: { label: SHOW_PROPOSALS ? "Open proposals for the next case" : "Wait for the next case", to: "submissions" },
  closing: { label: "Back to holding", to: "holding" },
};

async function control(path, body, method = "POST") {
  if (demo) {
    if (method === "DELETE") room.prompts = room.prompts.filter((p) => p.id !== path.split("/")[1]);
    if (path === "phase") room.phase = body.phase;
    if (path === "pick") { room.round = { n: room.round.n + 1, prompt_id: body.prompt_id, graded: 0 }; room.phase = "grading"; }
    if (path === "reasons") room.reasonsVisible = body.visible;
    render();
    return true;
  }
  $("status").textContent = "Sending.";
  const result = await postJson(`api/control/${path}`, body, { "X-Control-Token": token }, path === "pick" ? 1 : 2, method);
  $("status").textContent = result.ok ? "" : result.body.reason ?? result.body.detail ?? `Refused (${result.status}).`;
  return result.ok;
}

function sortedPrompts() {
  const list = [...room.prompts];
  if (sort === "order") return list.sort((a, b) => a.seq - b.seq);
  if (sort === "newest") return list.reverse();
  const score = (p) => (room.divergence[p.id]?.state === "done" ? room.divergence[p.id].score : -1);
  return list.sort((a, b) => score(b) - score(a) || b.seq - a.seq);
}

function chips(prompt) {
  return room.subjects
    .map((s) => {
      const answer = answerFor(room, prompt.id, s.id);
      const word = { queued: "waiting", running: "thinking", done: "done", empty: "no answer", failed: "no answer" }[answer.state] ?? answer.state;
      return `<span class="chip">${V.who(room, s)}<span class="chip__state">${word}</span></span>`;
    })
    .join("");
}

/** One line for a list row: the question, without its pasted context. */
function oneLine(text) {
  const line = (V.splitPrompt(text).question || String(text ?? "")).replace(/\s+/g, " ").trim();
  return line.length > 140 ? `${line.slice(0, 139)}…` : line;
}

function renderIncoming() {
  const rows = sortedPrompts();
  V.setHtml($("incoming"), rows.length
    ? rows.map((p) => {
        const d = room.divergence[p.id];
        const score = d?.state === "done" ? `${d.score.toFixed(2)}${d.method === "lexical" ? "*" : ""}` : d?.state === "failed" ? "unscored" : "…";
        const used = room.rounds.some((r) => r.prompt_id === p.id) || room.round.prompt_id === p.id;
        return `<li><button type="button" data-prompt="${escapeHtml(p.id)}"${p.id === selected ? ' aria-current="true"' : ""}>
          <span>${escapeHtml(oneLine(p.text))}${used ? ' <span class="dim">(used)</span>' : ""}</span><span class="score">${score}</span>
          <span class="chips roles">${chips(p)}</span></button></li>`;
      }).join("")
    : `<li class="dim">${room.phase === "submissions" ? "No cases yet. They appear here as people propose them." : SHOW_PROPOSALS ? "No cases yet. Add some above, or open proposals." : "No cases yet. Paste one above."}</li>`);
}

/** The next case not yet picked, in the order the list shows, so stepping through is one click. */
function nextInLine() {
  const left = sortedPrompts().filter((p) => !isUsed(p.id));
  return { next: left[0] ?? null, left: left.length };
}

/** What picking the selected prompt would do, so the bar and the panel say the same thing. */
function isUsed(id) {
  return room.round.prompt_id === id || room.rounds.some((r) => r.prompt_id === id);
}

function pickInfo(now) {
  const prompt = selected ? promptById(room, selected) : null;
  // A prompt already graded is never armed, so the last round's case is one tap from re-running.
  // Results count too, so the screen never drops to waiting between two cases.
  if (!prompt || !["holding", "submissions", "split"].includes(room.phase) || isUsed(prompt.id)) return null;
  // Grading on a missing answer would leave the room nothing to grade, so the pick waits for all four.
  // Empty and failed are final, so only queued or running holds the pick. A subject
  // stuck past PICK_ANYWAY_S can't stall the round: the pick opens, and says who is missing.
  const stuck = room.subjects.filter((s) => ["queued", "running"].includes(answerFor(room, prompt.id, s.id).state));
  const oldest = Math.max(0, ...stuck.map((s) => { const a = answerFor(room, prompt.id, s.id); return a.started_at ? seconds(a.started_at, now) : 0; }));
  const anyway = stuck.length > 0 && oldest >= PICK_ANYWAY_S;
  const label = !stuck.length
    ? `Pick this for case ${room.round.n + 1}, and open grading`
    : anyway
      ? `Pick anyway, without ${stuck.map((s) => s.label).join(" and ")}`
      : `Waiting on ${stuck.length} ${stuck.length === 1 ? "answer" : "answers"} before this can be picked`;
  return { label, disabled: stuck.length > 0 && !anyway };
}

function renderDetail(now) {
  const prompt = selected ? promptById(room, selected) : null;
  $("detail-title").textContent = prompt ? V.splitPrompt(prompt.text).question || prompt.text : "Pick a case to read its four answers";
  const d = prompt && room.divergence[prompt.id];
  const sure = d?.method === "lexical" ? null : V.jevConfidence(d);
  $("detail-meta").textContent = prompt ? `Prompt ${prompt.seq}${d?.state === "done" ? (d.method === "lexical" ? `, word overlap ${d.score.toFixed(2)} (Jev did not answer)` : `, answers differ by ${d.score.toFixed(2)}${sure === null ? "" : `, Jev is ${sure}% sure`}`) : ""}` : "";
  V.setHtml($("detail-case"), prompt ? V.caseCard(prompt, { withText: false, withContext: true, presenter: true }) : "");
  V.setHtml($("detail-answers"), prompt ? room.subjects.map((s) => V.answerCard(room, prompt.id, s, now, "", { cause: true })).join("") : "");
  V.setHtml($("detail-jev"), prompt ? V.measure(room, prompt.id) : "");
  // A case already in a round stays, and one still answering is left to finish.
  const running = prompt && room.subjects.some((s) => ["queued", "running"].includes(answerFor(room, prompt.id, s.id).state));
  $("case-controls").hidden = !prompt || isUsed(prompt.id);
  $("case-run").disabled = Boolean(running);
  const pick = pickInfo(now);
  $("pick").hidden = !pick;
  if (pick) {
    $("pick").disabled = pick.disabled;
    $("pick").textContent = pick.label;
  }
}

function renderRound() {
  const panel = $("round-panel");
  panel.hidden = !["grading", "split", "closing"].includes(room.phase);
  V.setHtml($("round-split"), "");
  V.setHtml($("round-eval"), "");
  V.setHtml($("round-failures"), "");
  if (room.phase === "grading") {
    $("round-title").textContent = `Case ${room.round.n}: grading`;
    $("round-meta").textContent = `${room.round.graded ?? 0} graded so far. The room sees a count, never a direction.`;
  } else if (room.phase === "split") {
    const last = room.rounds[room.rounds.length - 1];
    $("round-title").textContent = `Case ${last?.n ?? room.round.n}: results`;
    $("round-meta").textContent = promptById(room, last?.prompt_id)?.text ?? "";
    V.setHtml($("round-split"), (last && V.split(room, last.n, { tall: 10 })) ?? "");
    V.setHtml($("round-failures"), last ? V.roundReasons(room, last.n) : "");
  } else if (room.phase === "closing") {
    $("round-title").textContent = "The eval, with the reasons";
    $("round-meta").textContent = "The shared screen shows the table without reasons. The reasons are attendee-typed, so they're here to read aloud.";
    V.setHtml($("round-eval"), V.evalTable(room));
    V.setHtml($("round-failures"), V.failures(room) + V.notes(room));
  }
}

// The closer is a view of /screen on this same laptop, raised over a BroadcastChannel,
// so the shared tab never navigates. `/screen#closer` is the fallback on another machine.
let closerShown = false;
let screenChannel = null;
let screenAck = false;
let refused = false;
const SCREEN_SILENT = "The shared screen did not answer. Open it in this browser, or add #closer to its address.";
try {
  screenChannel = new BroadcastChannel("room-screen");
  screenChannel.onmessage = (event) => {
    if (event.data?.ask) screenChannel.postMessage({ closer: closerShown });
    if (event.data?.ack) screenAck = true;
    // A reloaded presenter learns what the shared screen is showing instead of guessing.
    if ("shown" in (event.data ?? {})) { closerShown = Boolean(event.data.shown); render(); }
  };
  screenChannel.postMessage({ query: true });
} catch {}

/** The channel only reaches a /screen tab in this browser profile, so a silent one is said aloud. */
function toggleCloser() {
  closerShown = !closerShown;
  screenAck = false;
  screenChannel.postMessage({ closer: closerShown });
  setTimeout(() => {
    if (!screenAck) $("status").textContent = SCREEN_SILENT;
    else if ($("status").textContent === SCREEN_SILENT) $("status").textContent = "";
  }, 1500);
  render();
}

function render() {
  if (!room) return;
  const now = Date.now();
  if (room.phase !== "closing" && closerShown) {
    closerShown = false;
    screenChannel?.postMessage({ closer: false });
  }
  // Attendees read the round being opened, so submissions names the next one.
  const shown = room.phase === "submissions" ? room.round.n + 1 : room.round.n;
  $("phase-label").textContent = shown ? `Case ${shown}` : "No case yet";
  const pick = pickInfo(now);
  const next = NEXT[room.phase];
  // In closing the primary raises the closer, since going back to holding resets the room.
  const raisesCloser = room.phase === "closing" && Boolean(screenChannel);
  $("next").textContent = pick ? pick.label : raisesCloser ? (closerShown ? "Back to the eval table" : "Show the closer on the shared screen") : next.label;
  $("next").disabled = pick ? pick.disabled : !raisesCloser && !next.to;
  $("finish").hidden = room.phase !== "split";
  $("cases-download").disabled = !room.prompts.length;
  $("cases-download").title = `${room.prompts.length} ${room.prompts.length === 1 ? "case" : "cases"}, in the order the list shows`;
  const { next: upNext, left } = nextInLine();
  const answering = upNext && room.subjects.some((s) => ["queued", "running"].includes(answerFor(room, upNext.id, s.id).state));
  $("pick-next").hidden = !["holding", "submissions", "split"].includes(room.phase) || !upNext;
  $("pick-next").disabled = Boolean(answering);
  $("pick-next").textContent = answering ? `Next case is still answering (${left} left)` : `Pick next case (${left} left)`;
  $("pick-next").title = upNext ? oneLine(upNext.text) : "";
  const hidden = room.reasonsVisible === false;
  $("reasons-toggle").textContent = hidden ? "Show comments to attendees" : "Hide comments from attendees";
  $("reasons-state").textContent = hidden ? "Comments are hidden from attendees." : "Attendees can read comments.";
  if (room.phase === "submissions" && selected && isUsed(selected)) selected = null;
  if (!selected && room.round.prompt_id) selected = room.round.prompt_id;
  renderIncoming();
  renderDetail(now);
  renderRound();
}

function renderLink() {
  $("banner").hidden = link.live;
  if (link.refused) {
    $("banner").hidden = true;
    $("surface").hidden = true;
    $("gate").hidden = false;
    refused = true;
    $("gate-why").textContent = "The room refused that token. Paste the one it printed when it started.";
    try { localStorage.removeItem("room-token"); } catch {}
  } else if (!link.live) {
    $("banner").textContent = `Reconnecting. This is from ${seconds(new Date(link.since).toISOString(), Date.now())}s ago.`;
  }
}

function start() {
  $("gate").hidden = true;
  $("surface").hidden = false;
  window.Room.connect(
    (next) => { room = next; render(); },
    (next) => { link = next; renderLink(); },
    {
      snapshotUrl: "api/control/room",
      eventsUrl: `api/room/events?view=presenter&token=${encodeURIComponent(token ?? "")}`,
      headers: { "X-Control-Token": token ?? "" },
      // Presenter events can carry answers with text the attendee shapes lack, so re-read the whole room.
      alwaysResnapshot: true,
    },
  );
  $("demo-chip").hidden = !demo;
  setInterval(() => { render(); renderLink(); }, 1000);
}

$("incoming").addEventListener("click", (event) => {
  const row = event.target.closest("button[data-prompt]");
  if (!row) return;
  selected = row.dataset.prompt;
  render();
});
document.querySelector(".sort").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-sort]");
  if (!button) return;
  sort = button.dataset.sort;
  document.querySelectorAll(".sort button").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
  render();
});
$("next").addEventListener("click", () => {
  if (pickInfo(Date.now())) return void control("pick", { prompt_id: selected });
  if (room.phase === "closing" && screenChannel) return toggleCloser();
  const next = NEXT[room.phase];
  if (next.to) void control("phase", { phase: next.to });
});
$("pick-next").addEventListener("click", () => {
  const { next: upNext } = nextInLine();
  if (!upNext) return;
  selected = upNext.id;
  void control("pick", { prompt_id: upNext.id });
});
$("finish").addEventListener("click", () => void control("phase", { phase: "closing" }));
$("reasons-toggle").addEventListener("click", async () => {
  const visible = room.reasonsVisible === false;
  if (await control("reasons", { visible })) {
    room.reasonsVisible = visible;
    render();
  }
});
$("case-run").addEventListener("click", () => {
  if (selected) void control(`cases/${selected}/run`, {});
});
$("case-delete").addEventListener("click", async () => {
  if (!selected || !window.confirm("Delete this case? It leaves the room and cannot be brought back.")) return;
  if (await control(`cases/${selected}`, undefined, "DELETE")) {
    selected = null;
    render();
  }
});
$("pick").addEventListener("click", () => {
  if (selected) void control("pick", { prompt_id: selected });
});
// ------------------------------------------------------ added cases
$("case-text").maxLength = CASE_MAX;
document.querySelector('label[for="case-text"]').textContent = `Add a case. Context first, then the question, up to ${CASE_MAX} characters`;
function caseNote(text, tone) {
  const el = $("case-note");
  el.hidden = !text;
  el.textContent = text;
  el.dataset.tone = tone;
}

async function addCase(c) {
  const clean = (v) => (typeof v === "string" ? v.trim() : "");
  const body = { text: clean(c.text) };
  return demo ? { ok: true, body: {} } : postJson("api/control/cases", body, { "X-Control-Token": token }, 1);
}

/** Every case in the room, in the order the list shows, as a list of {text}. */
function casesJson() {
  const cases = sortedPrompts().filter((p) => p.text).map((p) => ({ text: p.text }));
  return JSON.stringify(cases, null, 2);
}

$("cases-download").addEventListener("click", () => {
  const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, "");
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([casesJson(), "\n"], { type: "application/json" }));
  link.download = `housecast-cases-${stamp}.json`;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
});

let loading = false;

function setLoading(on) {
  loading = on;
  $("case-add").disabled = on;
}

$("case-add").addEventListener("click", async () => {
  if (loading) return;
  setLoading(true);
  const result = await addCase({ text: $("case-text").value });
  setLoading(false);
  if (result.ok) {
    $("case-text").value = "";
    caseNote("Added. The four are answering it now.", "ok");
  } else {
    caseNote(result.body.reason ?? result.body.detail ?? `The room refused that (${result.status}).`, "error");
  }
});

$("gate").addEventListener("submit", (event) => {
  event.preventDefault();
  token = $("gate-token").value.trim();
  keepToken(token);
  // A refused session holds a stopped stream and old headers, so it starts clean.
  if (refused) location.reload();
  else start();
});

if (token || demo) start();
else $("gate").hidden = false;
</script>
</body>
</html>
