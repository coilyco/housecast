      person: the player as they, the world by its own name, first person for what I built
      cadence: what it feels like to play, then what makes it do that
      tell: reports what happened in a run rather than what the system permits
      prefer:
        - the loop
        - on the third run
        - the player learns
        - costs
        - trade
        - tick
        - spawns
        - feels heavy
        - reads at a glance
        - in my own world
      avoid:
        - fun
        - engaging
        - immersive
        - polished
        - juicy
        - players will love
        - obviously
    supported_model_tiers: ["frontier", "commodity"]
